  <g transform="translate(200 110) scale(.6) translate(-200 -108)">
    <polygon points="200,56 211,88 240,70 223,100 254,108 223,118 240,148 211,128 200,160 189,128 160,148 177,118 146,108 177,100 160,70 189,88" fill="#ffc83d" stroke="#0e1330" stroke-width="6" stroke-linejoin="round"/>
